name: Build OpenWrt packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "24.10.2 mediatek/filogic"
            sdk_url: "https://downloads.openwrt.org/releases/24.10.2/targets/mediatek/filogic/openwrt-sdk-24.10.2-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            target_arch: "aarch64_cortex-a53"
            version_path: "24.10"
          - name: "21.02.7 ramips/mt7621"
            sdk_url: "https://downloads.openwrt.org/releases/21.02.7/targets/ramips/mt7621/openwrt-sdk-21.02.7-ramips-mt7621_gcc-8.4.0_musl.Linux-x86_64.tar.xz"
            target_arch: "mipsel_24kc"
            version_path: "21.02"
          - name: "21.02.7 mediatek/mt7622"
            sdk_url: "https://downloads.openwrt.org/releases/21.02.7/targets/mediatek/mt7622/openwrt-sdk-21.02.7-mediatek-mt7622_gcc-8.4.0_musl.Linux-x86_64.tar.xz"
            target_arch: "aarch64_cortex-a53"
            version_path: "21.02"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          set -euxo pipefail
      
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            coreutils \
            gawk \
            gettext \
            unzip \
            file \
            python3 \
            rsync \
            curl \
            ca-certificates \
            zstd \
            wget \
            xz-utils \
            git \
            patch \
            diffutils \
            findutils \
            perl \
            libncurses-dev \
            zlib1g-dev

          echo "[check] GNU install"
          command -v install
          install --version

      - name: Download SDK
        run: |
          set -euxo pipefail
          echo "[sdk] mkdir /tmp/openwrt-sdk"
          mkdir -p /tmp/openwrt-sdk
          echo "[sdk] wget SDK"
          wget -O sdk.tar.archive "${{ matrix.sdk_url }}"
          
          echo "[sdk] extract SDK"
          # Try tar with auto-detect first, if fails use explicit based on extension
          if [[ "${{ matrix.sdk_url }}" == *".zst" ]]; then
            tar --use-compress-program=unzstd -xf sdk.tar.archive --directory=/tmp/openwrt-sdk --strip-components=1
          else
            tar -xf sdk.tar.archive --directory=/tmp/openwrt-sdk --strip-components=1
          fi
          
          echo "[sdk] tree"
          ls -lah /tmp/openwrt-sdk

      - name: Feeds update
        run: |
          set -euxo pipefail
          echo "[feeds] add local feed"
          # Copy default feed config and append our local feed
          cp /tmp/openwrt-sdk/feeds.conf.default /tmp/openwrt-sdk/feeds.conf
          echo "" >> /tmp/openwrt-sdk/feeds.conf
          echo "src-link tg_notify ${GITHUB_WORKSPACE}/package" >> /tmp/openwrt-sdk/feeds.conf
          
          echo "[feeds] update -a"
          cd /tmp/openwrt-sdk
          ./scripts/feeds update -a

      - name: Feeds install
        run: |
          set -euxo pipefail
          echo "[feeds] install -a"
          cd /tmp/openwrt-sdk
          ./scripts/feeds install -a

      - name: Defconfig
        run: |
          set -euxo pipefail
          echo "[config] make defconfig"
          cd /tmp/openwrt-sdk
          make defconfig

      - name: Build packages
        run: |
          set -euxo pipefail
          cd /tmp/openwrt-sdk
          echo "[build] tg-notify"
          make package/tg-notify/compile -j"$(nproc)" V=s
          echo "[build] luci-app-tg-notify"
          make package/luci-app-tg-notify/compile -j"$(nproc)" V=s

      - name: Index repository (make package/index)
        run: |
          set -euxo pipefail
          cd /tmp/openwrt-sdk
          ARCH="${{ matrix.target_arch }}"

          # Если задан ключ — кладём его в корень SDK как "key-build"
          if [ -n "${{ secrets.USIGN_KEY }}" ]; then
            echo "[index] write key-build"
            printf "%s" "${{ secrets.USIGN_KEY }}" > key-build
          else
            echo "[index] no USIGN_KEY secret provided (index will be unsigned)"
          fi

          echo "[index] make package/index"
          make package/index V=s

          echo "[index] copy out"
          mkdir -p ${GITHUB_WORKSPACE}/packages/${{ matrix.version_path }}/${ARCH}
          # mkdir -p ${GITHUB_WORKSPACE}/packages/${{ matrix.version_path }}/all

          # Извлекаем собранные пакеты из SDK
          # Путь может варьироваться, ищем в bin/packages/
          # Обычно это bin/packages/<arch>/tg_notify/
          
          # На всякий случай выведем структуру bin/packages
          find bin/packages -maxdepth 3 -type d || true

          rsync -a bin/packages/${ARCH}/tg_notify/ ${GITHUB_WORKSPACE}/packages/${{ matrix.version_path }}/${ARCH}/ || true
          rsync -a bin/packages/all/tg_notify/ ${GITHUB_WORKSPACE}/packages/${{ matrix.version_path }}/${ARCH}/ || true

          echo "[index] result:"
          find ${GITHUB_WORKSPACE}/packages -maxdepth 2 -type f -printf "%P\n" | sort || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.version_path }}-${{ matrix.target_arch }}
          path: packages/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare packages for deploy
        run: |
          mkdir -p packages
          
          # Flatten artifacts: move version folders from inside artifact folders to root packages/
          find artifacts -mindepth 2 -maxdepth 2 -type d -exec cp -rf {} packages/ \;

      - name: Publish public signing key
        run: |
          cp key-build.pub packages/key-build.pub
        
      - name: Generate Index Files
        uses: gacts/directory-listing@v1
        with:
          target: packages
          show-hidden: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./packages
