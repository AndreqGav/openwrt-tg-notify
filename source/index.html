<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Directory Listing</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; padding: 20px; line-height: 1.5; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 5px 0; }
        a { text-decoration: none; color: #0366d6; }
        a:hover { text-decoration: underline; }
        .dir { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Index of <span id="path">/</span></h1>
    <hr>
    <ul id="list">
        <li>Loading...</li>
    </ul>
    <hr>
    <script>
        (function() {
            const repo = 'AndreqGav/openwrt-tg-notify';
            const branch = 'gh-pages';
            
            // Get current path from URL, remove repo name if present
            // e.g. /openwrt-tg-notify/21.02/ -> 21.02
            let path = location.pathname.replace(/^\/openwrt-tg-notify\/?/, '');
            // Remove trailing slash
            path = path.replace(/\/$/, '');
            path = path.replace(/^$/, '');

            document.getElementById('path').innerText = '/' + path;

            const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`;

            fetch(apiUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => {
                    const list = document.getElementById('list');
                    list.innerHTML = '';

                    // Add parent link if not root
                    if (path) {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = '../';
                        a.innerText = '../';
                        a.className = 'dir';
                        li.appendChild(a);
                        list.appendChild(li);
                    }

                    // Sort: directories first, then files
                    data.sort((a, b) => {
                        if (a.type === b.type) return a.name.localeCompare(b.name);
                        return a.type === 'dir' ? -1 : 1;
                    });

                    data.forEach(file => {
                        if (file.name === 'index.html') return;
                        
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        // For directories, ensure trailing slash for proper relative navigation
                        a.href = file.name + (file.type === 'dir' ? '/' : '');
                        a.innerText = file.name + (file.type === 'dir' ? '/' : '');
                        if (file.type === 'dir') a.className = 'dir';
                        li.appendChild(a);
                        list.appendChild(li);
                    });
                })
                .catch(err => {
                    document.getElementById('list').innerHTML = '<li>Error loading directory listing: ' + err.message + '</li>';
                    console.error(err);
                });
        })();
    </script>
</body>
</html>
